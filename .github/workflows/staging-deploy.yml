name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: |
          find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path('.').rglob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))

          print('JSON validation passed.')
          PY

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DH_STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.DH_STAGING_HOST }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH authentication
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DH_STAGING_HOST }}
          SSH_USER: ${{ secrets.DH_STAGING_USER }}
        run: |
          set -e

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH authentication successful'"

      - name: Deploy to staging website
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DH_STAGING_HOST }}
          SSH_USER: ${{ secrets.DH_STAGING_USER }}
          SSH_PATH: ${{ secrets.DH_STAGING_PATH }}
        run: |
          set -e

          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=yes" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.DS_Store' \
            --exclude '.env' \
            --exclude 'wp-config.php' \
            --exclude 'wp-content/uploads' \
            --exclude 'wp-content/cache' \
            --exclude 'wp-content/litespeed' \
            --exclude 'wp-content/ewww' \
            --exclude 'wp-content/wflogs' \
            --exclude 'wp-content/upgrade*' \
            --exclude 'wp-content/*-old' \
            --exclude '*.log' \
            ./ \
            "$SSH_USER@$SSH_HOST:$SSH_PATH/"

      - name: Run remote sanity checks
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DH_STAGING_HOST }}
          SSH_USER: ${{ secrets.DH_STAGING_USER }}
          SSH_PATH: ${{ secrets.DH_STAGING_PATH }}
        run: |
          set -e

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "php -l '$SSH_PATH/index.php' && \
             test -d '$SSH_PATH/wp-content' && \
             test -d '$SSH_PATH/wp-admin' && \
             echo 'Remote WordPress sanity checks passed.'"